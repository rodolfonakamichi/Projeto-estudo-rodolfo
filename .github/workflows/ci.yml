name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    # Testes de integração usam MySQL de verdade (banco comandas_test)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/comandas?serverVersion=8.4.0&charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl
          coverage: none

      - name: Validar composer.json
        run: composer validate --strict

      - name: Cache do vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências
        run: composer install --no-interaction --no-progress

      - name: Encoding UTF-8
        run: |
          fail=0
          while IFS= read -r f; do
            enc=$(file -b --mime-encoding "$f")
            case "$enc" in
              utf-8|us-ascii|binary) ;;
              *) echo "não-UTF-8 ($enc): $f"; fail=1 ;;
            esac
          done < <(git ls-files)
          exit $fail

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      # PHPStan lê o container compilado (extensão phpstan-symfony)
      - name: Aquecer cache do container
        run: bin/console cache:warmup --env=dev

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Deptrac (regra de camadas)
        run: vendor/bin/deptrac analyse --no-progress

      - name: Lint do container
        run: bin/console lint:container

      - name: Banco de teste (cria + migrations)
        run: |
          bin/console doctrine:database:create --env=test --if-not-exists
          bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Schema bate com o mapeamento
        run: bin/console doctrine:schema:validate --env=test

      - name: PHPUnit
        run: bin/phpunit
