# Regra de dependência entre camadas (ADR-002), verificada no CI.
#   Presentation -> Application -> Domain <- Infrastructure
# Rodar: vendor/bin/deptrac analyse
deptrac:
  paths:
    - ./src
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/Infrastructure/.*
    - name: Presentation
      collectors:
        - type: directory
          value: src/Presentation/.*
    # Única lib de terceiro permitida no Domain (ADR-005, embrulhada em App\Domain\Shared\Ulid)
    - name: SymfonyUid
      collectors:
        - type: classLike
          value: ^Symfony\\Component\\Uid\\.*
    - name: Vendor
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^(Symfony|Doctrine|Psr)\\.*
          must_not:
            - type: classLike
              value: ^Symfony\\Component\\Uid\\.*
  ruleset:
    Domain:
      - SymfonyUid
    Application:
      - Domain
    Infrastructure:
      - Domain
      - Application
      - SymfonyUid
      - Vendor
    Presentation:
      - Application
      - Domain
      - Vendor
