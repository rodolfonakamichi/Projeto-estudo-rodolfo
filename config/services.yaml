# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# Ponto de entrada da configuração dos NOSSOS serviços.
# packages/ configura as dependências (Doctrine, Messenger...).

parameters:

services:
    _defaults:
        autowire: true      # injeta dependências pelo tipo do construtor
        autoconfigure: true # registra comandos, controllers, handlers... pelos atributos

    # Todas as classes de src/ viram serviço (id = FQCN)...
    App\:
        resource: '../src/'
        exclude:
            # ...menos o Domain: entidades e Value Objects são criados com `new`
            # ou named constructors, nunca pelo container (ADR-002).
            - '../src/Domain/'
            - '../src/Kernel.php'

    # Handlers de caso de uso -> command.bus. Basta implementar a interface.
    _instanceof:
        App\Application\Shared\Bus\CommandHandler:
            tags: [{ name: messenger.message_handler, bus: command.bus }]
        App\Application\Shared\Bus\EventHandler:
            tags: [{ name: messenger.message_handler, bus: event.bus }]
