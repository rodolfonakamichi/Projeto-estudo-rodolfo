server {
      listen 80;
      server_name _;

      root /var/www/public;
      index index.php;

      # Front controller: tudo que não for arquivo/dir real vai para index.php
      location / {
          try_files $uri $uri/ /index.php?$query_string;
      }

      # Executa PHP via FastCGI no container `php`
      location ~ \.php$ {
          fastcgi_pass php:9000;
          fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
          include fastcgi_params;
      }

      # Bloqueia dotfiles (.env, .git, ...), exceto .well-known
      location ~ /\.(?!well-known) {
          deny all;
      }
}